<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gestión de Pedidos - TechMart</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- Barra de Navegación Superior -->
        <header class="app-header">
            <div class="header-container">
                <div class="header-brand">
                    <span class="brand-title">TechMart</span>
                    <span class="brand-separator">|</span>
                    <span class="page-title">Gestión de Pedidos</span>
                </div>
                <nav class="header-nav">
                    <button class="btn-nav" onclick="navegarA('productos')">
                        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                        <span>Ir a Productos</span>
                    </button>
                    <button class="btn-nav btn-logout" id="btn-logout" onclick="cerrarSesion()">
                        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Cerrar Sesión</span>
                    </button>
                </nav>
            </div>
        </header>

        <!-- Contenedor Principal -->
        <div class="contenedor">
            <div class="table-header-bar">
                <div>
                    <h2 class="section-title">Pedidos por Atender</h2>
                    <p class="section-subtitle">Cola de pedidos recibidos para procesamiento</p>
                </div>
            </div>

            <!-- Contenedor de la tabla -->
            <table class="tabla-pedidos">
                <!-- Cabeceras o Nombres de las Columnas -->
                <thead>
                    <tr>
                        <!-- Datos -->
                        <th>ID Pedido</th>
                        <th>Nombre Cliente</th>
                        <th>Nombre Producto</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                        <th style="text-align: center;">Acción</th>
                    </tr>
                </thead>
                <!-- Cuerpo o renglones con los datos -->
                <tbody>
                    <!-- Se llenará dinámicamente -->
                </tbody>
            </table>
        </div>

        <!-- Script a ejecutar -->
        <script src="logicUI.js"></script>
    </body>
</html>
