# ==============================================================================
# CONFIGURACIÓN DE RED Y SERVIDOR
# ==============================================================================
# Puerto en el que se ejecutará el servidor HTTP del microservicio.
# Se utiliza el puerto 8084 para evitar colisiones de puertos con otros microservicios (8080-8083).
server.port=8084

# ==============================================================================
# IDENTIFICACIÓN DEL MICROSERVICIO
# ==============================================================================
# Nombre único que identifica a este microservicio dentro del sistema.
# Se utiliza para trazabilidad en logs, mensajería con RabbitMQ y registro en Service Discovery.
spring.application.name=notificaciones

# ==============================================================================
# CONFIGURACIÓN DE CONEXIÓN A RABBITMQ
# ==============================================================================
# Dirección IP o Host del servidor de RabbitMQ (localhost para entorno local)
spring.rabbitmq.host=localhost

# Puerto estándar del protocolo AMQP de RabbitMQ
spring.rabbitmq.port=5672

# Credenciales por defecto de RabbitMQ
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==========================================
# CONFIGURACIÓN DEL SERVIDOR DE CORREO (SMTP)
# ==========================================

# Servidor de salida que procesará los envíos (ej. Gmail, Outlook, Mailtrap)
spring.mail.host=smtp.gmail.com

# Puerto de conexión seguro estándar para envío de correos (TLS/STARTTLS)
spring.mail.port=587

# Cuenta de correo desde la cual saldrán todas las notificaciones del sistema
spring.mail.username=cuellar.11498@gmail.com

# Contraseña de aplicación generada en la cuenta del emisor (no la contraseña normal)
spring.mail.password=rndj nphj libd rhzm

# Habilita la autenticación con usuario y contraseña antes de enviar
spring.mail.properties.mail.smtp.auth=true

# Activa el cifrado de seguridad TLS para que el contenido viaje de forma encriptada
spring.mail.properties.mail.smtp.starttls.enable=true