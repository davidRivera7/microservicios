events {
    worker_connections 1024;
}

http {
    upstream clientes_service {
        server servicio-clientes:8083;
    }

    upstream productos_service {
        server servicio-productos:8081;
    }

    upstream pedidos_service {
        server servicio-pedidos:8082;
    }

    server {
        listen 8000 ssl;
        listen 443 ssl;
        server_name localhost;
		
		ssl_certificate /etc/nginx/nginx.crt;
        ssl_certificate_key /etc/nginx/nginx.key;

        error_page 497 =307 https://$host:$server_port$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Clientes (.NET)
        location ~* ^/api/clientes(/.*)?$ {
            proxy_pass http://clientes_service;
        }

        # Productos (Java/Spring)
        location ~* ^/api/productos(/.*)?$ {
            proxy_pass http://productos_service;
        }

        # Pedidos (Go) - Redirige /api/pedidos a /pedidos en el contenedor de Go
        location /api/pedidos {
            rewrite ^/api/pedidos/(.*) /$1 break;
            rewrite ^/api/pedidos$ /pedidos break;
            proxy_pass http://pedidos_service;
        }

        location / {
            return 302 /productos/;
        }

        # Página web del microservicio de Pedidos
        location /pedidos/ {
            proxy_pass http://pedidos_service/;
        }

        # Página web del microservicio de Productos
        location /productos/ {
            proxy_pass http://productos_service/;
        }
    }
}