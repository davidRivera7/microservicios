server.port=8081
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot

# Usamos variables de entorno con un valor por defecto (localhost)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_productos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Configuración de archivos estáticos desde la carpeta frontend exterior
spring.web.resources.static-locations=file:/app/static/,file:../../frontend/Productos/,classpath:/static/